name: Java Benchmarks CI

on:
  workflow_dispatch:
    inputs:
      baseline_label:
        description: Label to use as baseline for comparison (e.g., temurin-24)
        required: false
        type: string
      candidate_label:
        description: Label to use as candidate for comparison (e.g., temurin-25)
        required: false
        type: string
      bench_include:
        description: JMH regex to include specific benchmarks (e.g., "Regex.*|Json.*")
        required: false
        type: string
      jmh_opts:
        description: Extra JMH options (e.g., "-wi 5 -i 10 -bm avgt -tu ns")
        required: false
        type: string
  workflow_call:
    inputs:
      baseline_label:
        description: Label to use as baseline for comparison (e.g., temurin-24)
        required: false
        type: string
      candidate_label:
        description: Label to use as candidate for comparison (e.g., temurin-25)
        required: false
        type: string
      bench_include:
        description: JMH regex to include specific benchmarks (e.g., "Regex.*|Json.*")
        required: false
        type: string
      jmh_opts:
        description: Extra JMH options (e.g., "-wi 5 -i 10 -bm avgt -tu ns")
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-run:
    name: Run JMH (${{ matrix.distribution }}-${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: [25, 17]
        distribution: [temurin, zulu, microsoft, graalvm-community, oracle]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git for commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Setup JDK depending on distribution
      - name: Setup Java (non-GraalVM)
        id: setupjava
        if: matrix.distribution != 'graalvm-community'
        uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Setup GraalVM
        id: setupgraal
        if: matrix.distribution == 'graalvm-community'
        uses: graalvm/setup-graalvm@v1
        continue-on-error: true
        with:
          distribution: 'graalvm-community'
          java-version: ${{ matrix.java }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'false'

      - name: Print Java version
        if: steps.setupjava.outcome == 'success' || steps.setupgraal.outcome == 'success'
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          mvn -v

      - name: Run benchmarks for this JDK
        if: steps.setupjava.outcome == 'success' || steps.setupgraal.outcome == 'success'
        working-directory: java-in-time
        env:
          # Default to a small smoke subset unless explicitly overridden via workflow input
          BENCH_INCLUDE: ${{ inputs.bench_include }}
          # JMH_OPTS may be empty here; run-benchmarks.sh supplies fast defaults
          JMH_OPTS: ${{ inputs.jmh_opts }}
        run: |
          label="${{ matrix.distribution }}-${{ matrix.java }}"
          bash scripts/run-benchmarks.sh "$label:$JAVA_HOME"

      - name: Upload results artifact
        if: steps.setupjava.outcome == 'success' || steps.setupgraal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.distribution }}-${{ matrix.java }}
          path: java-in-time/results/
          if-no-files-found: error

  ec-build:
    name: Eclipse Collections (${{ matrix.distribution }}-${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [25, 21, 17]
        distribution: [temurin, oracle]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build eclipse-collections benchmarks
        working-directory: eclipse-collections
        run: mvn -ntp clean package

      - name: Upload EC results artifact
        uses: actions/upload-artifact@v4
        with:
          name: results-ec-${{ matrix.distribution }}-${{ matrix.java }}
          path: eclipse-collections/results/*.json
          if-no-files-found: warn

  gc-build:
    name: GC Benchmarks (${{ matrix.distribution }}-${{ matrix.java }})
    runs-on: ubuntu-latest
    if: matrix.java == 25
    strategy:
      fail-fast: false
      matrix:
        java: [25]
        distribution: [temurin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run GC benchmarks
        working-directory: gc-benchmarks
        run: |
          mkdir -p results
          mvn clean package -DskipTests
          java -XX:+UseG1GC -jar target/benchmarks.jar -rf json -rff results/g1gc.json
          java -XX:+UseZGC -jar target/benchmarks.jar -rf json -rff results/zgc.json

      - name: Upload GC results artifact
        uses: actions/upload-artifact@v4
        with:
          name: results-gc
          path: gc-benchmarks/results/*.json
          if-no-files-found: error

  compare:
    name: Compare Results
    needs: build-and-run
    runs-on: ubuntu-latest
    if: >-
      ${{ (inputs.baseline_label != '' && inputs.candidate_label != '') ||
           (github.event_name == 'workflow_dispatch' && inputs.baseline_label != '' && inputs.candidate_label != '') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java for comparator (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Download baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: results-${{ inputs.baseline_label }}
          path: results-baseline

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: results-${{ inputs.candidate_label }}
          path: results-candidate

      - name: Build shaded jar (for comparator tool)
        working-directory: java-in-time
        run: mvn -q -ntp -DskipTests clean package

      - name: Find JSON files
        id: findjson
        shell: bash
        run: |
          base_json=$(ls results-baseline/*.json | head -n1)
          cand_json=$(ls results-candidate/*.json | head -n1)
          echo "baseline_json=$base_json" >> $GITHUB_OUTPUT
          echo "candidate_json=$cand_json" >> $GITHUB_OUTPUT
          echo "Found baseline: $base_json"
          echo "Found candidate: $cand_json"

      - name: Compare baseline vs candidate
        run: |
          mkdir -p docs
          out="docs/compare-${{ inputs.baseline_label }}-vs-${{ inputs.candidate_label }}.md"
          java -cp java-in-time/target/benchmarks.jar io.github.benchjava.tools.CompareResults "${{ steps.findjson.outputs.baseline_json }}" "${{ steps.findjson.outputs.candidate_json }}" > "$out"
          echo "Wrote $out"

      - name: Upload comparison markdown
        uses: actions/upload-artifact@v4
        with:
          name: compare-${{ inputs.baseline_label }}-vs-${{ inputs.candidate_label }}
          path: docs/compare-${{ inputs.baseline_label }}-vs-${{ inputs.candidate_label }}.md
          if-no-files-found: error

      - name: Comment comparison on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          header: benchmark-compare
          message: |
            Benchmark comparison for `${{ inputs.baseline_label }}` vs `${{ inputs.candidate_label }}`:

            <details>
            <summary>Open results</summary>

            ```
            $(cat docs/compare-${{ inputs.baseline_label }}-vs-${{ inputs.candidate_label }}.md)
            ```

            </details>

  publish:
    name: Publish results to Pages content
    needs: [build-and-run, ec-build, gc-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all java-in-time results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: artifacts/jit

      - name: Download all eclipse-collections results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-ec-*
          merge-multiple: true
          path: eclipse-collections/results

      - name: Download GC results artifact
        uses: actions/download-artifact@v4
        with:
          name: results-gc
          path: gc-benchmarks/results

      - name: Build comparator tool (for auto-comparisons)
        working-directory: java-in-time
        run: mvn -q -ntp -DskipTests clean package

      - name: Generate docs pages and update index.md
        shell: bash
        run: |
          set -euo pipefail
          # Ensure filename globs that match nothing expand to empty (not literal patterns)
          shopt -s nullglob
          mkdir -p docs

          # Build gc-benchmarks to have the tool available
          pushd gc-benchmarks && mvn -q -ntp -DskipTests clean package && popd

          # Generate GC comparison
          if [ -f gc-benchmarks/results/g1gc.json ] && [ -f gc-benchmarks/results/zgc.json ]; then
            java -cp gc-benchmarks/target/benchmarks.jar io.github.benchjava.tools.SummarizeGCResults \
              gc-benchmarks/results/g1gc.json \
              gc-benchmarks/results/zgc.json > docs/gc-benchmarks.md
            echo -e "\n## Benchmarks Description\n\n### allocateShortLived\nAllocates many short-lived String objects to a List. This benchmark tests how efficiently the GC handles high allocation rates of small objects.\n\n### allocateLargeObjects\nAllocates 1MB byte arrays. This benchmark tests how the GC handles large object allocations (Humongous objects in G1)." >> docs/gc-benchmarks.md
          fi

          repo="${GITHUB_REPOSITORY}"
          branch="${GITHUB_REF_NAME}"

          # Ensure only java-in-time JSONs end up under java-in-time/results
          mkdir -p java-in-time/results
          # Purge any existing JSONs to avoid mixing results across commits
          rm -f java-in-time/results/*.json || true
          # Remove any previously mixed-in non-JIT JSONs (anything not matching allowed distro-version pattern)
          shopt -s nullglob
          for f in java-in-time/results/*.json; do
            base=$(basename "$f")
            if [[ ! "$base" =~ ^(temurin|zulu|microsoft|graalvm-community|oracle)-[0-9]+\.json$ ]]; then
              echo "Removing non-JIT JSON from java-in-time/results: $base"
              rm -f "$f"
            fi
          done
          # Move freshly downloaded artifacts: keep only files matching allowed distro-version pattern
          for f in artifacts/jit/*.json; do
            base=$(basename "$f")
            if [[ "$base" =~ ^(temurin|zulu|microsoft|graalvm-community|oracle)-[0-9]+\.json$ ]]; then
              mv "$f" java-in-time/results/
            else
              echo "Skipping non-JIT JSON in artifacts/jit: $base"
            fi
          done

          # 1) Java-in-time page
          JIT_DOC=docs/java-in-time.md
          echo "# Java-in-time Results" > "$JIT_DOC"
          echo >> "$JIT_DOC"
          echo "This page lists raw JSON outputs produced by the java-in-time JMH suite and provides a combined viewer link." >> "$JIT_DOC"
          echo >> "$JIT_DOC"
          # Build filtered list of JIT JSONs matching allowed distro-version pattern
          all_jsons=(java-in-time/results/*.json)
          jsons=()
          for f in "${all_jsons[@]}"; do
            base=$(basename "$f")
            if [[ "$base" =~ ^(temurin|zulu|microsoft|graalvm-community|oracle)-[0-9]+\.json$ ]]; then
              jsons+=("$f")
            fi
          done
          if [ ${#jsons[@]} -gt 0 ]; then
            echo "## Raw JSON files" >> "$JIT_DOC"
            for f in "${jsons[@]}"; do
              base=$(basename "$f")
              echo "- $base" >> "$JIT_DOC"
            done
            url_list=""
            for f in "${jsons[@]}"; do
              raw="https://raw.githubusercontent.com/${repo}/${branch}/${f}"
              if [ -z "$url_list" ]; then url_list="$raw"; else url_list="$url_list,$raw"; fi
            done
            echo >> "$JIT_DOC"
            echo "## View in JMH viewer" >> "$JIT_DOC"
            echo "[Open all in jmh.morethan.io](https://jmh.morethan.io/?sources=${url_list})" >> "$JIT_DOC"
            echo >> "$JIT_DOC"
            echo "## Big table (all JSONs)" >> "$JIT_DOC"
            echo "A single Markdown table with all available result files as columns:" >> "$JIT_DOC"
            echo "" >> "$JIT_DOC"
            # Generate a big table with all JSONs using CompareResults (multi-file mode)
            java -cp java-in-time/target/benchmarks.jar io.github.benchjava.tools.CompareResults "${jsons[@]}" > docs/java-in-time-all.md
            echo "[Open the big table](./java-in-time-all.md)" >> "$JIT_DOC"
          else
            echo "No JSON results found yet." >> "$JIT_DOC"
          fi

          # 2) Eclipse Collections page
          EC_DOC=docs/eclipse-collections.md
          echo "# Eclipse Collections Results" > "$EC_DOC"
          echo >> "$EC_DOC"
          echo "This page lists raw JSON outputs produced by the Eclipse Collections benchmark module and provides a combined viewer link." >> "$EC_DOC"
          echo >> "$EC_DOC"
          ec_jsons=(eclipse-collections/results/*.json)
          if [ ${#ec_jsons[@]} -gt 0 ]; then
            echo "## Raw JSON files" >> "$EC_DOC"
            for f in "${ec_jsons[@]}"; do
              base=$(basename "$f")
              echo "- $base" >> "$EC_DOC"
            done
            ec_url_list=""
            for f in "${ec_jsons[@]}"; do
              raw="https://raw.githubusercontent.com/${repo}/${branch}/${f}"
              if [ -z "$ec_url_list" ]; then ec_url_list="$raw"; else ec_url_list="$ec_url_list,$raw"; fi
            done
            echo >> "$EC_DOC"
            echo "## View in JMH viewer" >> "$EC_DOC"
            echo "[Open all in jmh.morethan.io](https://jmh.morethan.io/?sources=${ec_url_list})" >> "$EC_DOC"
            
            # Generate summary table from the latest JSON (e.g., 25.0.1 if exists)
            latest_ec=$(ls eclipse-collections/results/25.0.1*.json 2>/dev/null | head -n1 || ls eclipse-collections/results/*.json | tail -n1)
            if [ -n "$latest_ec" ]; then
              echo >> "$EC_DOC"
              java -cp java-in-time/target/benchmarks.jar io.github.benchjava.tools.SummarizeECResults "$latest_ec" >> "$EC_DOC"
            fi
          else
            echo "No JSON results found yet." >> "$EC_DOC"
          fi

          # 3) Auto-generate comparisons for multiple scenarios
          echo >> "$JIT_DOC"
          echo "## Auto-comparisons" >> "$JIT_DOC"
          echo "Automatically generated comparisons across versions (within a distribution) and across distributions (same Java version), only when both JSON files exist." >> "$JIT_DOC"

          # Distributions we support in JIT
          dists=(oracle zulu graalvm-community temurin microsoft)

          # Discover available versions from filenames, prefer known order 11 17 24 25
          declare -A seen_versions=()
          for f in java-in-time/results/*.json; do
            base=$(basename "$f")
            if [[ "$base" =~ ^(temurin|zulu|microsoft|graalvm-community|oracle)-([0-9]+)\.json$ ]]; then
              seen_versions["${BASH_REMATCH[2]}"]=1
            fi
          done
          vers=()
          for v in 11 17 25; do
            if [[ -n "${seen_versions[$v]:-}" ]]; then vers+=("$v"); fi
          done

          # 3a) Cross-version comparisons (ALL pairs, not just adjacent) per distribution
          echo >> "$JIT_DOC"
          echo "### Cross-version (within same distribution)" >> "$JIT_DOC"
          for d in "${dists[@]}"; do
            # Generate all i<j pairs among available versions
            for ((i=0; i<${#vers[@]}; i++)); do
              for ((j=i+1; j<${#vers[@]}; j++)); do
                a=${vers[$i]}
                b=${vers[$j]}
                base="java-in-time/results/${d}-${a}.json"
                cand="java-in-time/results/${d}-${b}.json"
                if [[ -f "$base" && -f "$cand" ]]; then
                  out="docs/compare-${d}-${a}-vs-${b}.md"
                  echo "Generating $out from $base vs $cand"
                  if java -cp java-in-time/target/benchmarks.jar io.github.benchjava.tools.CompareResults "$base" "$cand" > "$out"; then
                    rel="./compare-${d}-${a}-vs-${b}.md"
                    echo "- ${d}: ${a} vs ${b} → [view](${rel})" >> "$JIT_DOC"
                  else
                    echo "Skipping ${d} ${a} vs ${b} due to benchmark set mismatch (CompareResults non-zero)."
                    rm -f "$out" || true
                  fi
                else
                  echo "Skipping ${d} ${a} vs ${b} (missing files)"
                fi
              done
            done
          done

          # 3b) Cross-distribution comparisons for the same Java version
          echo >> "$JIT_DOC"
          echo "### Cross-distribution (same Java version)" >> "$JIT_DOC"
          # Pairwise compare distributions for each available version
          for v in "${vers[@]}"; do
            for ((i=0; i<${#dists[@]}; i++)); do
              for ((j=i+1; j<${#dists[@]}; j++)); do
                d1=${dists[$i]}
                d2=${dists[$j]}
                f1="java-in-time/results/${d1}-${v}.json"
                f2="java-in-time/results/${d2}-${v}.json"
                if [[ -f "$f1" && -f "$f2" ]]; then
                  out="docs/compare-${d1}-vs-${d2}-${v}.md"
                  echo "Generating $out from $f1 vs $f2"
                  if java -cp java-in-time/target/benchmarks.jar io.github.benchjava.tools.CompareResults "$f1" "$f2" > "$out"; then
                    rel="./compare-${d1}-vs-${d2}-${v}.md"
                    echo "- Java ${v}: ${d1} vs ${d2} → [view](${rel})" >> "$JIT_DOC"
                  else
                    echo "Skipping cross-distribution ${d1} vs ${d2} on Java ${v} due to benchmark set mismatch (CompareResults non-zero)."
                    rm -f "$out" || true
                  fi
                else
                  echo "Skipping cross-distribution ${d1} vs ${d2} on Java ${v} (missing files)"
                fi
              done
            done
          done

          # Ensure index.md links to the pages
          touch index.md
          if ! grep -q "^## Java-in-time$" index.md 2>/dev/null; then
            {
              echo ""
              echo "## Java-in-time"
              echo "See the Java-in-time benchmark outputs: [java-in-time results](./docs/java-in-time.md)"
            } >> index.md
          fi
          if ! grep -q "^## Eclipse Collections$" index.md 2>/dev/null; then
            {
              echo ""
              echo "## Eclipse Collections"
              echo "See the Eclipse Collections benchmark outputs: [eclipse-collections results](./docs/eclipse-collections.md)"
            } >> index.md
          fi

          # Update the date in the footer
          current_date=$(date +%Y-%m-%d)
          if grep -q "^Date created: " index.md; then
            sed -i "s/^Date created: .*/Date created: $current_date/" index.md
          else
            printf "\n---\nDate created: %s\n" "$current_date" >> index.md
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Publish java-in-time results and docs [skip ci]"
