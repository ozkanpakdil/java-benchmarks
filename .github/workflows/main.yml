name: Running Benchmarks JMH
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  schedule:
    # The ONLY automatic full test suite run: native builds + "latest"
    # release + gatling + k6 + mastodon, on the 5th of each month at
    # 10:00 UTC (11:00 UK). PR builds are disabled entirely (no pull_request
    # trigger in native-build.yml): renovate PRs auto-merge without a CI
    # gate and any breakage is caught and fixed at the next monthly run.
    # Also runnable manually at any time.
    - cron: '0 10 5 * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  pages: write
  pull-requests: write
  deployments: write
  statuses: write
  checks: write
  packages: write
  repository-projects: write

jobs:
  run-benchmarks:
    uses: ./.github/workflows/benchmarks.yml
    with:
      baseline_label: ${{ inputs.baseline_label }}
      candidate_label: ${{ inputs.candidate_label }}
      bench_include: ${{ inputs.bench_include }}
      jmh_opts: ${{ inputs.jmh_opts }}
