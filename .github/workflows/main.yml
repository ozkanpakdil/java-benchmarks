name: Running Benchmarks JMH
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:
    inputs:
      baseline_label:
        description: Label to use as baseline for comparison (e.g., temurin-24)
        required: false
        type: string
      candidate_label:
        description: Label to use as candidate for comparison (e.g., temurin-25)
        required: false
        type: string
      bench_include:
        description: JMH regex to include specific benchmarks (e.g., "Regex.*|Json.*")
        required: false
        type: string
      jmh_opts:
        description: Extra JMH options (e.g., "-wi 5 -i 10 -bm avgt -tu ns")
        required: false
        type: string

jobs:
  run-benchmarks:
    uses: ./.github/workflows/benchmarks.yml
    with:
      baseline_label: ${{ inputs.baseline_label }}
      candidate_label: ${{ inputs.candidate_label }}
      bench_include: ${{ inputs.bench_include }}
      jmh_opts: ${{ inputs.jmh_opts }}
